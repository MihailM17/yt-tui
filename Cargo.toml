[package]
name = "yt-tui"
version = "0.1.0"
edition = "2021"
description = "Lightweight terminal YouTube client (ratatui + mpv + yt-dlp). ASCII thumbs, no browser."
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Future (wire up when ready, kept out of default build for min RAM):
# ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }
# image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
